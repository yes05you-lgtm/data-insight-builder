<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="bar1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bar2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bar3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="bar4Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bgGrad)" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Horizontal Grid Lines -->
  <line x1="84" y1="360" x2="428" y2="360" stroke="#94a3b8" stroke-width="2" stroke-opacity="0.2"/>
  <line x1="84" y1="285" x2="428" y2="285" stroke="#94a3b8" stroke-width="2" stroke-opacity="0.2"/>
  <line x1="84" y1="210" x2="428" y2="210" stroke="#94a3b8" stroke-width="2" stroke-opacity="0.2"/>
  <line x1="84" y1="135" x2="428" y2="135" stroke="#94a3b8" stroke-width="2" stroke-opacity="0.2"/>

  <!-- Graph Rising Bars -->
  <!-- Bar 1 (Height: 80) -->
  <rect x="96" y="320" width="56" height="80" rx="12" fill="url(#bar1Grad)"/>
  <!-- Bar 2 (Height: 140) -->
  <rect x="180" y="260" width="56" height="140" rx="12" fill="url(#bar2Grad)"/>
  <!-- Bar 3 (Height: 200) -->
  <rect x="264" y="200" width="56" height="200" rx="12" fill="url(#bar3Grad)"/>
  <!-- Bar 4 (Height: 260 - Highlighted Korea / Peak) -->
  <rect x="348" y="140" width="56" height="260" rx="12" fill="url(#bar4Grad)" stroke="#fecaca" stroke-width="2"/>

  <!-- Trend Line with Glow -->
  <polyline points="124,320 208,260 292,200 376,140" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Data Dots on Trend Line -->
  <circle cx="124" cy="320" r="9" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="208" cy="260" r="9" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="292" cy="200" r="9" fill="#ffffff" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="376" cy="140" r="11" fill="#ffffff" stroke="#ef4444" stroke-width="4"/>

  <!-- Insight AI Star in top right -->
  <path d="M 416 80 L 420 98 L 438 102 L 420 106 L 416 124 L 412 106 L 394 102 L 412 98 Z" fill="#fde047" filter="url(#glow)"/>
</svg>
